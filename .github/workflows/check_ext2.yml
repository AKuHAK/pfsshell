name: Test pfsshell EXT2 support

on:
  push:
    paths:
      - "**.c"
      - "**.h"
      - "**.cpp"
      - "**.hpp"
      - "**.build"
      - "**.in"
      - "**.yml"
  pull_request:
    paths:
      - "**.c"
      - "**.h"
      - "**.cpp"
      - "**.hpp"
      - "**.build"
      - "**.in"
      - "**.yml"

env:
  CMAKE_GENERATOR: Ninja
  DEBIAN_FRONTEND: noninteractive
  TZ: Japan

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ubuntu:20.04
      options: --user 0
    steps:
      - name: Install build dependencies
        run: |
          apt-get -y update
          apt-get -y -o Dpkg::Options::='--force-confdef' -o Dpkg::Options::='--force-confold' install build-essential expect pkg-config fuse libfuse-dev git time p7zip-full e2fsprogs python3

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v3
        with:
          python-version: 3.13.3

      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip
          restore-keys: ${{ runner.os }}-pip

      - run: python -m pip install --upgrade meson ninja

      - name: Build pfsshell
        run: |
          meson setup build/ -Denable_pfs2tar=true
          meson compile -C build

      - name: Run Test
        run: |
          cd test
          time ./pfsshell_test.tcl

      - name: Verify EXT2 partition validity
        run: |
          cd test
          python3 -c "
          import sys, os

          # EXT2 constants
          MAGIC = b'\x53\xEF'  # 0xEF53 (Little Endian)
          SB_OFFSET = 1024     # Superblock starts at 1024 bytes from partition start
          MAGIC_OFFSET = 56    # Signature is at 56th byte of superblock
          # So, signature offset from partition start = 1080 bytes

          IMG_FILE = 'test.img'
          OUT_FILE = 'ext2_dump.img'
          PARTITION_SIZE = 128 * 1024 * 1024 # 128 MB (as in test)
          CHUNK_SIZE = 10 * 1024 * 1024      # Read in 10 MB chunks

          print(f'Scanning {IMG_FILE} for EXT2 magic signature...')

          found = False
          if not os.path.exists(IMG_FILE):
              print(f'Error: {IMG_FILE} not found!')
              sys.exit(1)

          with open(IMG_FILE, 'rb') as f:
              offset = 0
              while True:
                  # Read chunk + small overlap to avoid splitting signature
                  f.seek(offset)
                  data = f.read(CHUNK_SIZE)
                  if not data:
                      break

                  # Search for signature inside chunk
                  rel_pos = -1
                  while True:
                      try:
                          rel_pos = data.index(MAGIC, rel_pos + 1)
                      except ValueError:
                          break

                      # Found signature at absolute offset abs_magic_pos
                      abs_magic_pos = offset + rel_pos

                      # Suspected partition start
                      part_start = abs_magic_pos - (SB_OFFSET + MAGIC_OFFSET)

                      if part_start < 0:
                          continue

                      # Alignment check (optional but useful)
                      # Partitions are usually aligned to sectors (512 bytes)
                      if part_start % 512 == 0:
                          print(f'FOUND EXT2 signature at offset {abs_magic_pos}')
                          print(f'-> Suspected partition start at {part_start}')

                          # Extract partition
                          f.seek(part_start)
                          part_data = f.read(PARTITION_SIZE)

                          with open(OUT_FILE, 'wb') as out:
                              out.write(part_data)

                          print(f'Dumped {len(part_data)} bytes to {OUT_FILE}')
                          found = True
                          break

                  if found:
                      break

                  offset += CHUNK_SIZE
                  if offset > 1024:
                      offset -= 1024

          if not found:
              print('EXT2 partition NOT found!')
              sys.exit(1)
          "

          echo "Running e2fsck on extracted partition..."
          /sbin/e2fsck -f -n ext2_dump.img

          if [ $? -eq 0 ]; then
            echo "SUCCESS: EXT2 Filesystem is VALID."
          else
            echo "FAILURE: EXT2 Filesystem is CORRUPT."
            exit 1
          fi
